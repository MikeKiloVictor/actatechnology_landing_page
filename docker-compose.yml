services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: actatechnology_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8081
      APP_KEY: docker-local-dev-key
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: actatechnology
      DB_USERNAME: acta_user
      DB_PASSWORD: acta_pass
      DB_CHARSET: utf8mb4
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"

  db:
    image: mysql:8.4
    container_name: actatechnology_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: actatechnology
      MYSQL_USER: acta_user
      MYSQL_PASSWORD: acta_pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:latest
    container_name: actatechnology_mailpit
    restart: unless-stopped
    ports:
      - "8026:8025"

volumes:
  db_data:
