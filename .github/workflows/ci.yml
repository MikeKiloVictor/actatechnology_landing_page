name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run CI checks
        run: bash scripts/ci.sh

  artifacts:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        site: [actagroup, actaconsult, actatechnology]
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated artifacts
        run: bash scripts/build-artifacts.sh
      - name: Verify artifact isolation
        run: bash scripts/verify-artifact.sh "${{ matrix.site }}" "dist/${{ matrix.site }}"
      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.site }}-${{ github.sha }}"
          path: "dist/${{ matrix.site }}"
          if-no-files-found: error
          retention-days: 14
